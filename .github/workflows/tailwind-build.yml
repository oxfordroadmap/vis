# .github/workflows/tailwind-build.yml
name: Build TailwindCSS

on:
  push:
    paths:
      - 'assets/css/**'
      - 'tailwind.config.js'
      - 'postcss.config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buildTailwind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Hugo stats
        # 🗃️ Downloads the hugo_stats.json file generated by the previous workflow
        uses: actions/download-artifact@v4
        with:
            name: hugo-stats
            path: ./

      # 🧪 First: Install Node.js WITHOUT caching yet
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'

      # 🧩 Then: Install pnpm explicitly so it's available
      - name: Install pnpm
        run: npm install -g pnpm

      # 🧠 Now that pnpm is installed, enable cache
      - name: Setup cache for pnpm
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # 🧩 Finally: Install dependencies using pnpm
      - name: Install dependencies
        run: pnpm install

      - name: Build TailwindCSS
        run: |
          mkdir -p assets/dist
          npx tailwindcss -c tailwind.config.js -i ./assets/css/styles.css -o ./assets/dist/wc.min.css --minify
        # -c tailwind.config.js: explicitly uses your Tailwind config file.
        # -i ./assets/css/styles.css: points to your custom entry file.
        # -o ./assets/dist/wc.min.css: outputs minified CSS to the correct dist location.

      - name: Pull latest changes from origin
        run: |
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git fetch origin
            git reset --soft origin/main

      - name: Commit compiled CSS
        run: |
            git add assets/dist/wc.min.css
            git commit -m "Build TailwindCSS: wc.min.css" || echo "No changes to commit"
            git push origin HEAD:main
        env:
            GITHUB_TOKEN: ${{ secrets.PAT_DEPLOY }}