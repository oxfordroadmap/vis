name: Deploy website to GitHub Pages

env:
  WC_HUGO_VERSION: '0.136.5'

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    # Allows manual triggering of the workflow
    # with inputs to control the deployment, making manual deploys more flexible,
    inputs:
      forceDeploy:
        description: 'Force deploy even if no changes'
        required: false
        default: 'false'

permissions:
  # Provide permission to clone the repo and deploy it to GitHub Pages
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false
  # Ensures that only one deployment is active at a time

jobs:
  buildHugo:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          # Fetch history for Hugo's .GitInfo and .Lastmod
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true
      - name: Cache Hugo modules
        uses: actions/cache@v3
        with:
          path: /tmp/hugo_cache_runner/
          key: ${{ runner.os }}-hugo-modules-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-hugo-modules-
      - name: Setup Github Pages
        # Extracts metadata, Prepares the environment for later steps like upload-pages-artifact and deploy-pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site with Hugo
        env:
          HUGO_ENVIRONMENT: production
        # hugo mod clean --all
        # echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
        # hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
        run: |
          echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"  --gc --cleanDestinationDir
      - name: Generate Pagefind search index
        run: npx pagefind --site "public"
      - name: Upload artifact only
        uses: actions/upload-pages-artifact@v3  #	📦 Prepares your site for GitHub Pages deployment by uploading the static site as an artifact
        with:
          path: ./public
  # when using "Upload artifact only" above, this step is needed

  deploy:
    if: github.repository_owner != 'HugoBlox'
    needs: buildHugo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare tag
        id: prepare_tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "DEPLOY_TAG_NAME=deploy-${TAG_NAME}" >> "${GITHUB_OUTPUT}"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          tag_name: ${{ steps.prepare_tag.outputs.DEPLOY_TAG_NAME }}
          tag_message: 'Deployment ${{ github.ref_name }}'  
