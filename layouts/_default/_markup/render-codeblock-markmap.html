{{/* Markmap with zoom enabled */}}
{{/* Markmap container that survives DOM replacement */}}
<div class="markmap [&_svg]:w-full [&_svg]:h-full [&_svg]:block" 
     style="height: {{ .Attributes.height | default "500px" }}" data-zoomable="">
{{/* No indentation before PRE and .Inner otherwise mindmap first item will be indented */}}
<pre>{{- .Inner | safeHTML -}}</pre>
</div>
{{ .Page.Store.Set "has_markmap" true }}
{{ .Page.Store.Set "has_zoom" true }}
